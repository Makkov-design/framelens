<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame Lens</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #16171d;
        --muted: #5d6170;
        --line: #e3e4ea;
        --accent: #2f6fe0;
        --rec: #d93025;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171d;
          --fg: #eceef4;
          --muted: #9da2b3;
          --line: #2c2e38;
          --accent: #7aa7ff;
          --rec: #ff6b5e;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: 14px; font-weight: 650; }
      header p { margin: 2px 0 0; color: var(--muted); }
      main { padding: 12px 16px 16px; display: grid; gap: 10px; }
      button { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: 0.55; cursor: default; }
      button small { display: block; font-weight: 400; color: var(--muted); }
      #record.on { border-color: var(--rec); color: var(--rec); }
      #status { min-height: 1.45em; margin: 0; color: var(--muted); overflow-wrap: anywhere; }
      #status.error { color: var(--rec); }
      code { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </head>
  <body>
    <header>
      <h1>Frame Lens</h1>
      <p>Saves to Downloads/FrameLens. Nothing leaves this computer.</p>
    </header>
    <main>
      <button id="read" type="button">Read this page's motion<small>Animations, curves, fonts and colours; the page scrolls once.</small></button>
      <button id="record" type="button">Record this tab<small>A WebM of what you watch, with its sound.</small></button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
