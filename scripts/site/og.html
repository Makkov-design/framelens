<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame Lens social card</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=panchang@700&f[]=general-sans@400,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../../docs/tokens.css">
<style>
  /* Source of docs/assets/og.png and the README banner: node <hallmark>/scripts/capture.mjs scripts/site/og.html --selector ".og" */
  body { margin: 0; background: var(--color-paper); }
  .og { width: 1200px; height: 630px; box-sizing: border-box; padding: 64px; background: var(--color-field); color: var(--color-field-ink); display: grid; grid-template-rows: auto 1fr auto; font-family: var(--font-body); }
  .og--wide { width: 1280px; height: 520px; }
  .top { display: flex; justify-content: space-between; align-items: center; font: 600 22px/1 var(--font-body); }
  .mark { font: 700 26px/1 var(--font-display); }
  h1 { margin: 40px 0 0; font: 700 72px/1.04 var(--font-display); letter-spacing: -0.01em; max-width: 13ch; }
  .strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 10px; border-radius: 14px; background: var(--color-band); position: relative; }
  .strip img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; }
  .strip .cut { position: absolute; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--color-accent); }
  .cmd { font: 600 22px/1 var(--font-outlier); background: var(--color-field-ink); color: var(--color-field); padding: 12px 18px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="og">
    <div class="top"><span class="mark">Frame Lens</span><span class="cmd">npx -y framelens init</span></div>
    <h1>Video your agent can measure</h1>
    <div class="strip">
      <img src="../../docs/assets/bbb/f21.webp" alt="">
      <img src="../../docs/assets/bbb/f31.webp" alt="">
      <img src="../../docs/assets/bbb/f41.webp" alt="">
      <img src="../../docs/assets/bbb/f54.webp" alt="">
      <img src="../../docs/assets/bbb/f61.webp" alt="">
      <span class="cut" style="left: calc(20% + 1px)"></span>
      <span class="cut" style="left: calc(60% + 1px)"></span>
    </div>
  </div>
</body>
</html>
