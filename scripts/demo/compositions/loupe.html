  <script>
    // Frame Lens's reading of the Big Buck Bunny trailer (docs/assets/bbb/reading.js): duration and cut times.
    const DUR = 32.995;
    const CUTS = [9.08, 11.2, 13.2, 13.88, 15, 16, 16.6, 24.92, 26, 29.96, 31.04];
    const K = 0.18; // demo seconds per trailer second
    const SWEEP_AT = 0.4; // local start of the playhead sweep
    const at = (c) => Math.round((SWEEP_AT + K * c) * 30) / 30; // on a whole frame, like the image swaps

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#lp-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 0.04);
    tl.fromTo("#lp-read .lp-row", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out", stagger: 0.06 }, 0.16);
    tl.set(".lp-cut", { scaleY: 0 }, 0);
    // Bands are revealed behind the playhead; the playhead itself is progress, so linear.
    const prog = { t: 0 };
    tl.fromTo("#lp-bands", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: K * DUR, ease: "none" }, SWEEP_AT);
    tl.fromTo("#lp-head", { x: 0 }, { x: 1152, duration: K * DUR, ease: "none" }, SWEEP_AT);
    tl.fromTo(prog, { t: 0 }, {
      t: DUR, duration: K * DUR, ease: "none",
      onUpdate: () => {
        const t = prog.t;
        const n = CUTS.filter((c) => at(c) <= tl.time() + 1e-6).length;
        document.querySelector("#lp-time").textContent = t.toFixed(2) + " s";
        document.querySelector("#lp-fr").textContent = String(Math.round(t * 25));
        document.querySelector("#lp-shot").textContent = (n + 1) + " of 12";
        document.querySelector("#lp-ncut").textContent = String(n);
      },
    }, SWEEP_AT);
    CUTS.forEach((c, i) => {
      tl.fromTo("#lp-cut-" + String(i + 1).padStart(2, "0"), { scaleY: 0 }, { scaleY: 1, duration: 0.12, ease: "expo.out" }, at(c));
    });
    window.__timelines["loupe"] = tl;
