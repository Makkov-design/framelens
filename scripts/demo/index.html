<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: oklch(82% 0.2 142); }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <!--
      Frame Lens 2.1 demo. 30 fps. The proof scene's two moves are known curves that Frame Lens measures back (CHECK.md).
      Every number on screen comes from docs/assets/bbb/reading.js (Frame Lens's reading of the
      Big Buck Bunny trailer) or from the real export files; see SPEC.md.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.6" data-fps="30" data-width="1920" data-height="1080">
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="loupe" data-composition-id="loupe" data-composition-src="compositions/loupe.html" data-start="2.8" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="9.8" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="palette" data-composition-id="palette" data-composition-src="compositions/palette.html" data-start="17" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="code" data-composition-id="code" data-composition-src="compositions/code.html" data-start="20" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="24.6" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Bed: "Plathe (Beatless Ambient Mix)" by POA, CC BY 3.0 (Jamendo 596719), from 4 s into the file. -->
      <audio id="bed" class="clip" src="assets/music/plathe-beatless-ambient-mix.mp3" data-start="0" data-duration="28.6" data-media-start="4" data-volume="0.22" data-fade-in="0.4" data-fade-out="1.6" data-track-index="2"></audio>

      <!-- Loupe: one tick per measured cut, on the frame the playhead crosses it (2.8 + 0.4 + 0.18 c s). -->
      <audio id="tick-01" class="clip" src="assets/sfx/tick-a.mp3" data-start="4.833" data-duration="0.27" data-volume="0.9" data-track-index="3"></audio>
      <audio id="tick-02" class="clip" src="assets/sfx/tick-b.mp3" data-start="5.2" data-duration="0.27" data-volume="0.9" data-track-index="4"></audio>
      <audio id="tick-03" class="clip" src="assets/sfx/tick-a.mp3" data-start="5.567" data-duration="0.133" data-volume="0.9" data-track-index="3"></audio>
      <audio id="tick-04" class="clip" src="assets/sfx/tick-b.mp3" data-start="5.7" data-duration="0.2" data-volume="0.9" data-track-index="4"></audio>
      <audio id="tick-05" class="clip" src="assets/sfx/tick-a.mp3" data-start="5.9" data-duration="0.167" data-volume="0.9" data-track-index="3"></audio>
      <audio id="tick-06" class="clip" src="assets/sfx/tick-b.mp3" data-start="6.067" data-duration="0.133" data-volume="0.9" data-track-index="4"></audio>
      <audio id="tick-07" class="clip" src="assets/sfx/tick-a.mp3" data-start="6.2" data-duration="0.27" data-volume="0.9" data-track-index="3"></audio>
      <audio id="tick-08" class="clip" src="assets/sfx/tick-b.mp3" data-start="7.7" data-duration="0.167" data-volume="0.9" data-track-index="4"></audio>
      <audio id="tick-09" class="clip" src="assets/sfx/tick-a.mp3" data-start="7.867" data-duration="0.27" data-volume="0.9" data-track-index="3"></audio>
      <audio id="tick-10" class="clip" src="assets/sfx/tick-b.mp3" data-start="8.6" data-duration="0.2" data-volume="0.9" data-track-index="4"></audio>
      <audio id="tick-11" class="clip" src="assets/sfx/tick-a.mp3" data-start="8.8" data-duration="0.27" data-volume="0.9" data-track-index="3"></audio>

      <!-- Proof: the ease-out block lands; the spring block is released. -->
      <audio id="land-a" class="clip" src="assets/sfx/wooden-block-tap.mp3" data-start="11.2" data-duration="0.06" data-volume="0.7" data-track-index="3"></audio>
      <audio id="go-b" class="clip" src="assets/sfx/click-b.mp3" data-start="12.8" data-duration="0.24" data-volume="0.5" data-track-index="3"></audio>

      <!-- Palette: one click per swatch landing. -->
      <audio id="sw-1" class="clip" src="assets/sfx/click-a.mp3" data-start="17.2" data-duration="0.17" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sw-2" class="clip" src="assets/sfx/click-b.mp3" data-start="17.3" data-duration="0.1" data-volume="0.5" data-track-index="4"></audio>
      <audio id="sw-3" class="clip" src="assets/sfx/click-a.mp3" data-start="17.4" data-duration="0.17" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sw-4" class="clip" src="assets/sfx/click-b.mp3" data-start="17.5" data-duration="0.1" data-volume="0.5" data-track-index="4"></audio>

      <!-- Code: one key per line arriving, a click on the tab. -->
      <audio id="key-1" class="clip" src="assets/sfx/key-a.mp3" data-start="20.5" data-duration="0.085" data-volume="0.6" data-track-index="3"></audio>
      <audio id="key-2" class="clip" src="assets/sfx/key-b.mp3" data-start="20.7" data-duration="0.135" data-volume="0.6" data-track-index="3"></audio>
      <audio id="key-3" class="clip" src="assets/sfx/key-a.mp3" data-start="20.9" data-duration="0.085" data-volume="0.6" data-track-index="3"></audio>
      <audio id="tab" class="clip" src="assets/sfx/click-a.mp3" data-start="22.4" data-duration="0.17" data-volume="0.5" data-track-index="3"></audio>
      <audio id="key-5" class="clip" src="assets/sfx/key-a.mp3" data-start="22.7" data-duration="0.085" data-volume="0.6" data-track-index="3"></audio>
      <audio id="key-6" class="clip" src="assets/sfx/key-b.mp3" data-start="22.9" data-duration="0.135" data-volume="0.6" data-track-index="3"></audio>
      <audio id="key-7" class="clip" src="assets/sfx/key-a.mp3" data-start="23.1" data-duration="0.085" data-volume="0.6" data-track-index="3"></audio>

      <!-- End card: the Star button lands. -->
      <audio id="star" class="clip" src="assets/sfx/click-b.mp3" data-start="25.78" data-duration="0.24" data-volume="0.55" data-track-index="3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
