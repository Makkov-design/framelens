version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch bumps come together; every major bump gets a PR of its own, so a breaking change is reviewed
    # and merged (or declined) on its own. The bundle is rebuilt on these PRs by dependabot-bundle.yml.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
