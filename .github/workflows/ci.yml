name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # dependabot-bundle.yml starts CI this way after it commits a rebuilt bundle: its pushes start no workflow themselves.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ffmpeg for the media tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: Committed bundle is up to date
        run: git diff --exit-code --stat -- dist/framelens.mjs || (echo "Run npm run bundle and commit dist/framelens.mjs (on a Dependabot PR, dependabot-bundle.yml commits it)" && exit 1)
      - run: npm run build:extension
      - name: Committed extension build is up to date
        run: git diff --exit-code --stat -- extension/dist || (echo "Run npm run build:extension and commit extension/dist" && exit 1)
      - run: npm audit --audit-level=high

  unit-other-os:
    # The same suite on macOS and Windows, for path, process and file handling. These runners have no ffmpeg, so the
    # media and real-browser tests skip there; they run on Ubuntu above.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run --maxWorkers=2

  bundle-runs:
    # The committed bundle has no dependencies; check it starts on every supported Node version and runs a real
    # local tool (probe on a generated clip), copied alone into a temp folder with no node_modules.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg for the probe call
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Server starts, lists its tools and runs probe over stdio
        run: |
          cp dist/framelens.mjs .github/scripts/bundle-runs.mjs "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          node bundle-runs.mjs framelens.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t framelens .
