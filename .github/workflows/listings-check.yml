name: Listings check

# Once a week: is the version on npm also what the MCP Registry and the catalogues show? Catalogues have no API to
# push a release to; they copy from npm, GitHub or the Registry on their own schedule. When one is behind, this opens
# (or updates) a single issue that names it. Uses no secrets.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open or update the one tracking issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Compare
        id: compare
        run: |
          set +e
          node scripts/check-listings.mjs > report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the issue
        if: steps.compare.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Catalogue listings are behind npm"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
      - name: npm could not be read
        if: steps.compare.outputs.code == '1'
        run: exit 1
